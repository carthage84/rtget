[package]
name = "rtget"
version = "0.2.0"
edition = "2024"
description = "A concurrent wget-like downloader for HTTP/HTTPS and FTP/FTPS"
license = "GPL-3.0-or-later"
repository = "https://github.com/carthage84/rtget"
readme = "README.md"

[dependencies]
argh = "0.1.19"
bytes = "1"
env_logger = "0.11.11"
futures-util = "0.3"
indicatif = "0.18.6"
log = "0.4"
md-5 = "0.11"
percent-encoding = "2"
reqwest = { version = "0.13.4", default-features = false, features = ["charset", "cookies", "http2", "rustls", "socks", "stream", "system-proxy"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
suppaftp = { version = "10.0.2", features = ["tokio", "tokio-async-native-tls"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["fs", "io-std", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-socks = "0.5.3"
toml = "1"
url = "2"

[target.'cfg(unix)'.dependencies]
daemonize = "0.5.0"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "time"] }

[lints.rust]
linker_messages = "allow"

[profile.release]
strip = "debuginfo"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"